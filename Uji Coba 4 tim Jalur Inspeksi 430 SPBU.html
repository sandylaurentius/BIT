.num { font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 26px/1 var(--f-display); letter-spacing: 0.01em; text-wrap: balance; }
.brand .sub { color: var(--ink-2); font-size: 13px; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-left: auto; }
.kpi { display: grid; gap: 2px; min-width: 0; }
.kpi .l { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font: 600 18px/1.1 var(--f-display); }
.kpi .v small { font: 500 12px var(--f-ui); color: var(--ink-2); margin-left: 4px; }
.prog { width: 132px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 3px; }
.prog i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--raised); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.chip.ok .dot { background: var(--good); }
.chip.warn .dot { background: var(--warn); }
.myteam { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.myteam select { padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--raised); }

/* ---------- main ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 460px); gap: 12px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--sea); }
#map { position: absolute; inset: 0; background: var(--sea); }
.leaflet-container { font: 12px/1.4 var(--f-ui); background: var(--sea); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--ink-3) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-bar a { background: var(--raised); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-bar a:hover { background: var(--accent-wash); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--raised); color: var(--ink); box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 12px 14px; min-width: 240px; max-width: 300px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--ink-3); }

.mapbar { position: absolute; top: 10px; right: 10px; z-index: 500; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; max-width: calc(100% - 70px); }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; box-shadow: var(--shadow); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 9px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg .lab { font-size: 11px; color: var(--ink-3); padding: 4px 6px 4px 8px; align-self: center; }
.legend { position: absolute; left: 10px; bottom: 22px; z-index: 500; background: color-mix(in srgb, var(--raised) 94%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow); max-width: calc(100% - 20px); }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.legend .sw { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.legend .sw i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--raised); display: inline-block; }
.legend .note { color: var(--ink-3); font-size: 11px; margin-top: 3px; }
.maphint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 600; background: var(--accent); color: var(--accent-ink); padding: 6px 12px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); }

/* pins */
.pin { background: none; border: 0; }
.pin b { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--c); color: var(--ci); font: 600 11px/1 var(--f-ui); box-shadow: 0 0 0 2px var(--raised), 0 1px 3px rgba(0, 0, 0, 0.3); }
.pin.done b { background: var(--raised); color: var(--c); box-shadow: inset 0 0 0 2.5px var(--c), 0 0 0 2px var(--raised), 0 1px 3px rgba(0, 0, 0, 0.3); font-size: 12px; }
.pin.late b { box-shadow: 0 0 0 2px var(--raised), 0 0 0 4px var(--crit), 0 1px 3px rgba(0, 0, 0, 0.3); }
.pin.dot b { font-size: 0; box-shadow: 0 0 0 1.5px var(--raised); opacity: 0.55; }
.pin.dot.done b { opacity: 0.4; }
.pin.sel b { box-shadow: 0 0 0 2px var(--raised), 0 0 0 5px var(--accent), 0 2px 6px rgba(0, 0, 0, 0.35); }
.pin.focus b { animation: pulse 1.2s ease-out 2; }
@keyframes pulse { 0% { box-shadow: 0 0 0 2px var(--raised), 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px var(--raised), 0 0 0 14px transparent; } }
.home-pin { background: none; border: 0; }
.home-pin b { display: grid; place-items: center; width: 100%; height: 100%; background: var(--ink); color: var(--panel); border-radius: 6px; font: 700 10px/1 var(--f-ui); letter-spacing: 0.04em; box-shadow: 0 0 0 2px var(--raised), 0 2px 6px rgba(0, 0, 0, 0.35); }
.home-pin.cand b { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 2px var(--raised); }
.med-pin { background: none; border: 0; }
.med-pin b { display: block; width: 100%; height: 100%; border: 2px dashed var(--ink-2); border-radius: 50%; }
.lbl-kota span, .lbl-kec span { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }
.lbl-kota { background: none; border: 0; white-space: nowrap; font: 700 12px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--kota-line); text-shadow: 0 0 3px var(--land), 0 0 6px var(--land); pointer-events: none; }
.lbl-kec { background: none; border: 0; white-space: nowrap; font: 500 11px/1 var(--f-ui); color: var(--ink-3); text-shadow: 0 0 3px var(--land), 0 0 5px var(--land); pointer-events: none; }
.hide-kec .lbl-kec, .hide-kota .lbl-kota { display: none; }

/* ---------- panel ---------- */
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.filters { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.search { display: flex; gap: 6px; }
.search input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--raised); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--raised); cursor: pointer; font-size: 13px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.kchips { display: flex; flex-wrap: wrap; gap: 5px; }
.kchip { border: 1px solid var(--line-2); background: var(--raised); border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.kchip b { font-weight: 600; color: var(--ink); margin-left: 3px; font-variant-numeric: tabular-nums; }
.kchip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); }
.facets { display: grid; gap: 4px; }
.facets > details { border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
.facets > details > summary { cursor: pointer; padding: 6px 10px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
.facets > details > summary::-webkit-details-marker { display: none; }
.facets > details > summary .cnt { color: var(--accent); font-weight: 600; }
.facets > details[open] > summary { border-bottom: 1px solid var(--line); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px; }
.flist { max-height: 210px; overflow: auto; padding: 4px 6px 6px; }
.flist .fs { width: 100%; margin: 4px 0 6px; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); font-size: 12px; }
.opt { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 5px; font-size: 13px; cursor: pointer; }
.opt:hover { background: var(--accent-wash); }
.opt input { accent-color: var(--accent); margin: 0; }
.opt .n { margin-left: auto; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.opt.zero { opacity: 0.45; }
.opt .grp { color: var(--ink-3); font-size: 11px; }
.active { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--ink-2); }
.active .x { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-wash); border: 1px solid var(--accent); color: var(--ink); border-radius: 999px; padding: 2px 4px 2px 9px; cursor: pointer; }
.active .x span { font-size: 14px; line-height: 1; padding: 0 4px; color: var(--ink-2); }
.dates { display: flex; gap: 6px; align-items: center; padding: 6px 8px; flex-wrap: wrap; font-size: 12px; }
.dates input { padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); }

.tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 8px 11px 9px; cursor: pointer; font: 600 14px var(--f-ui); color: var(--ink-3); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabbody { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 18px; }
.banner { margin: 10px 14px 0; padding: 8px 10px; border-radius: 8px; background: var(--accent-wash); border: 1px solid var(--accent); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.banner b { font-weight: 600; }
.banner .sp { flex: 1; }

/* day strip */
.daynav { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.strip { display: flex; gap: 4px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; flex: 1; min-width: 0; }
.day { flex: 0 0 auto; display: grid; justify-items: center; gap: 1px; width: 48px; padding: 5px 0 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); cursor: pointer; scroll-snap-align: center; color: var(--ink-2); }
.day b { font: 600 11px var(--f-ui); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
.day span { font: 600 15px/1.1 var(--f-display); color: var(--ink); }
.day i { display: block; width: 30px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; }
.day i::after { content: ""; display: block; height: 100%; width: var(--p, 0%); background: var(--good); }
.day.we { background: repeating-linear-gradient(135deg, var(--raised) 0 6px, var(--land-nb) 6px 8px); }
.day.today { border-color: var(--ink-2); }
.day[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.day.late i::after { background: var(--crit); }
.dayhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 4px 0 10px; }
.dayhead h2 { margin: 0; font: 700 21px/1.1 var(--f-display); }
.dayhead .meta { color: var(--ink-2); font-size: 13px; }
.shiftday { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: -2px 0 12px; padding: 7px 10px; border: 1px dashed var(--line-2); border-radius: 8px; font-size: 12px; color: var(--ink-2); }
.shiftday > span:first-child { font-weight: 600; color: var(--ink); margin-right: 2px; }
.shiftday .hint { color: var(--ink-3); flex-basis: 100%; }
.shiftday .sp { flex: 1; }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.icon { min-width: 28px; padding-inline: 0; }
.btn.danger:hover:not([disabled]) { border-color: var(--crit); color: var(--crit); }
.card.editing { border-color: var(--line-2); }
.card.dropok { border-color: var(--accent); box-shadow: 0 0 0 3px var(--hl); }
.edbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent-wash) 45%, var(--raised)); font-size: 12px; }
.edbar .hint { color: var(--ink-3); }
.edbar .mvform { margin: 0; flex: 1 1 100%; }
.stop .edrow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
.stop .sq.grip { display: inline-flex; align-items: center; gap: 3px; width: auto; cursor: grab; user-select: none; -webkit-user-select: none; color: var(--ink-2); }
.stop .sq.grip i { display: block; width: 6px; height: 13px; background-image: radial-gradient(circle, var(--ink-3) 1px, transparent 1.3px); background-size: 3px 3.25px; }
.stop.dragging { opacity: 0.45; }
.stop.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.stop.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
.tag.ed { border-color: var(--accent); color: var(--ink); }
.tag.over { border-color: var(--serious); color: var(--ink); }
.mvform { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-wash); font-size: 12px; }
.mvform .ttl { font-weight: 600; color: var(--ink); }
.mvform label { display: inline-flex; align-items: center; gap: 5px; }
.mvform input, .mvform select { padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--raised); font-size: 13px; }
.mvform .hint { flex-basis: 100%; color: var(--ink-2); }
.addrow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px; border-top: 1px dashed var(--line-2); font-size: 12px; color: var(--ink-2); }
.addrow label { font-weight: 600; color: var(--ink); }
.addrow input, .addroute input { flex: 1 1 110px; min-width: 0; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); font: 13px var(--f-mono); }
.addroute { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 10px; font-size: 12px; color: var(--ink-2); }
.addroute b { flex-basis: 100%; font: 700 14px var(--f-display); color: var(--ink); }
.addroute label { display: inline-flex; align-items: center; gap: 5px; }
.addroute select { padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--raised); }
.addday { display: grid; gap: 8px; margin: -4px 0 12px; padding: 10px 12px 12px; border: 1px solid var(--accent); border-radius: 10px; background: color-mix(in srgb, var(--accent-wash) 55%, var(--raised)); font-size: 13px; }
.addday .adh { display: flex; align-items: center; gap: 8px; }
.addday .adh b { font: 700 16px var(--f-display); }
.addday .adh .sp { flex: 1; }
.addday .frow2 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.addday .frow2 label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.addday input[type="date"] { padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--raised); font-weight: 400; }
.addday .hint { color: var(--ink-2); font-size: 12px; }
.addday .adl { font-size: 12px; color: var(--ink-2); }
.addday textarea { min-height: 128px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--raised); line-height: 1.45; }
.addday .cbx { font-size: 12px; color: var(--ink-2); }
.addday .cbx[hidden] { display: none; }
.adprev { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.adprev .adsum { font-weight: 600; color: var(--ink); }
.adprev .adrow { display: flex; gap: 7px; align-items: baseline; }
.adprev .adrow .tbadge { min-width: 18px; height: 18px; font-size: 11px; flex: none; }
.adprev i { color: var(--ink-3); font-style: normal; }
.adprev .okm { color: var(--good-ink); }
.adprev .adwarn { color: var(--ink); border-left: 3px solid var(--warn); padding-left: 7px; }
.tag.xd { border-color: var(--accent); color: var(--ink); }
.parity { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: 6px; padding: 2px 7px; }
.parity b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }

.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); overflow: hidden; }
.card.hl { border-color: var(--accent); }
.chead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.tbadge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--c); color: var(--ci); font: 700 12px/1 var(--f-ui); }
.chead .tname { font: 700 16px var(--f-display); }
.chead .cm { color: var(--ink-2); font-size: 12px; }
.chead .sp { flex: 1; }
.stops { list-style: none; margin: 0; padding: 0; }
.stop { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 2px 10px; padding: 9px 12px; border-top: 1px solid var(--line); align-items: start; }
.stop:first-child { border-top: 0; }
.stop.off { opacity: 0.45; }
.stop .ck { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--good); cursor: pointer; }
.stop .sq { font: 700 15px/20px var(--f-display); color: var(--ink-3); width: 14px; text-align: center; }
.stop .body { min-width: 0; display: grid; gap: 2px; }
.stop .l1 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.stop .code { font: 500 13px var(--f-mono); color: var(--ink); cursor: pointer; text-decoration: underline dotted var(--line-2); text-underline-offset: 3px; }
.stop .eta { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stop .addr { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.stop .loc { font-size: 12px; color: var(--ink-3); }
.stop .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; align-items: center; }
.stop.done .code { text-decoration: line-through; color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.tag.gg { border-color: var(--warn); }
.tag.gg::before { content: "◆"; color: var(--warn); font-size: 9px; }
.tag.late { border-color: var(--crit); color: var(--ink); }
.tag.late::before { content: "!"; font-weight: 700; color: var(--crit); }
.tag.ok { border-color: var(--good); color: var(--ink); }
.tag.ok::before { content: "✓"; color: var(--good); font-weight: 700; }
.tag.ty { font-family: var(--f-mono); }
.cfoot { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 60%, var(--raised)); font-size: 12px; color: var(--ink-2); align-items: center; }
.empty { border: 1px dashed var(--line-2); border-radius: 10px; padding: 18px; color: var(--ink-2); text-align: center; }

/* list */
.lhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 8px; }
.lhead .sp { flex: 1; }
.sorts { display: flex; gap: 4px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); align-items: center; }
.sorts button { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 2px 7px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.sorts button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); }
.rows { display: grid; }
.rowi { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 4px; border-top: 1px solid var(--line); align-items: start; }
.rowi:hover { background: var(--accent-wash); }
.rowi .ck { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--good); }
.rowi .m { min-width: 0; cursor: pointer; }
.rowi .m .t { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }

    var scored = cands.map(function (seq) { return { seq: seq, len: tourLen(home, seq) }; })
      .sort(function (a, b) { return a.len - b.len; });
    var hasGG = pts.some(function (p) { return p.gg; });
    var choice = scored[0], sim = simulate(home, choice.seq, gday, cfg);
    if (gday && hasGG) {
      scored.forEach(function (c) {
        if (c.len > scored[0].len * 1.3) return;
        var s = simulate(home, c.seq, gday, cfg);
        var better = s.conflicts < sim.conflicts ||
          (s.conflicts === sim.conflicts && (s.wait < sim.wait - 1 || (Math.abs(s.wait - sim.wait) <= 1 && c.len < choice.len - 1e-9)));
        if (better) { choice = c; sim = s; }
      });
    }
    var tot = sim.legs.reduce(function (a, b) { return a + b; }, 0);
    return { seq: choice.seq, km: tot, legs: sim.legs, eta: sim.eta, back: hm(sim.end), ggWarn: sim.conflicts > 0, ggWait: Math.round(sim.wait), ggDay: gday };
  }
  // urutan ditentukan manual: hanya hitung ulang jarak & jam, tanpa mengubah urutan
  function timeRoute(home, pts, date, cfg) {
    var gday = isGGDay(date, cfg), sim = simulate(home, pts, gday, cfg);
    var tot = sim.legs.reduce(function (a, b) { return a + b; }, 0);
    return { seq: pts.slice(), km: tot, legs: sim.legs, eta: sim.eta, back: hm(sim.end), ggWarn: sim.conflicts > 0, ggWait: Math.round(sim.wait), ggDay: gday };
  }

  /* ---------- pencocokan kelompok ke tim (kesinambungan wilayah) ---------- */
  function assignTeams(groups, teams, lastPos) {
    var T = groups.length, best = null, bc = Infinity;
    var cen = groups.map(function (g) { return centroid(g.pts); });
    var perms = teams.length <= 7 ? permutations(teams.slice()) : [teams.slice()];
    perms.forEach(function (perm) {
      var c = 0;
      for (var i = 0; i < T; i++) { var lp = lastPos[perm[i]]; if (lp) c += km(lp, cen[i]); }
      if (c < bc - 1e-9) { bc = c; best = perm; }
    });
    return best;
  }

  /* ---------- perencana utama ---------- */
  function plan(points, cfg) {
    var home = cfg.home, k = Math.max(1, cfg.perTeam || 3);
    var days = calendar(cfg);
    var excl = {}; (cfg.exclude || []).forEach(function (id) { excl[id] = 1; });
    var byId = {}; points.forEach(function (p) { byId[p.id] = p; });
    var pool = points.filter(function (p) { return !excl[p.id]; });
    var used = {};
    var routes = [], lastPos = {}, notes = [];
    function take(ids) { ids.forEach(function (id) { used[id] = 1; }); pool = pool.filter(function (p) { return !used[p.id]; }); }
    function pushRoute(date, team, pts, phase, block) {
      var o = orderStops(home, pts, date, cfg);
      var kotas = []; o.seq.forEach(function (p) { if (kotas.indexOf(p.kota) < 0) kotas.push(p.kota); });
      routes.push({
        rid: date + '-T' + team, date: date, dow: dowOf(date), team: team, phase: phase, block: block || '',
        stops: o.seq.map(function (p) { return p.id; }), km: Math.round(o.km * 10) / 10,
        legs: o.legs.map(function (x) { return Math.round(x * 10) / 10; }), eta: o.eta, back: o.back,
        ggWarn: o.ggWarn, ggWait: o.ggWait, ggDay: o.ggDay, kota: kotas
      });
      lastPos[team] = centroid(pts);
    }
    var phases = (cfg.phases || []).slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; });
    var sectorQ = null; // mode menyebar
    phases.forEach(function (ph, pi) {
      var pdays = days.filter(function (d) { return d >= ph.from && d <= ph.to; });
      var teams = []; for (var t = 1; t <= ph.teams; t++) teams.push(t);
      if (ph.fixed) {
        if (!pdays.length) { notes.push('Hari tetap ' + ph.from + ' bukan hari kerja; SPBU tetap masuk antrean biasa.'); return; }
        var d0 = pdays[0];
        ph.fixed.forEach(function (ids, ti) {
          var pts = ids.map(function (id) { return byId[id]; }).filter(function (p) { return p && !used[p.id] && !excl[p.id]; });
          if (pts.length && ti < ph.teams) { pushRoute(d0, ti + 1, pts, pi, 'Tetap'); take(pts.map(function (p) { return p.id; })); }
        });
        return;
      }
      if (!pdays.length || !pool.length) return;
      if (cfg.mode === 'sebar') {
        if (!sectorQ) {
          var K = Math.max.apply(null, phases.map(function (x) { return x.teams || 1; }));
          sectorQ = makeSectors(pool, home, K, k, cfg).map(function (sec) {
            var blocks = cfg.priority !== 'none'
              ? [{ name: 'prioritas', pts: sec.filter(function (p) { return isPrio(p, cfg); }) }, { name: 'reguler', pts: sec.filter(function (p) { return !isPrio(p, cfg); }) }].filter(function (b) { return b.pts.length; })
              : [{ name: 'sektor', pts: sec }];
            return sequenceBlocks(blocks, home, k);
          });
        }
        pdays.forEach(function (d) {
          teams.forEach(function (tm) {
            var q = sectorQ[(tm - 1) % sectorQ.length], g = null;
            q = q.filter(function (x) { return x.pts.every(function (p) { return !used[p.id]; }); });
            sectorQ[(tm - 1) % sectorQ.length] = q;
            if (q.length) g = q.shift();
            else {
              var bi = -1, bl = 0;
              sectorQ.forEach(function (qq, i) {
                var live = qq.filter(function (x) { return x.pts.every(function (p) { return !used[p.id]; }); });
                sectorQ[i] = live; if (live.length > bl) { bl = live.length; bi = i; }
              });
              if (bi >= 0) g = sectorQ[bi].pop();
            }
            if (g) { pushRoute(d, tm, g.pts, pi, 'Sektor ' + tm); take(g.pts.map(function (p) { return p.id; })); }
          });
        });
        return;
      }
      // mode per kota/kab
      var seq = sequenceBlocks(blocksKota(pool, cfg, ph.focus), home, k), si = 0;
      pdays.forEach(function (d) {
        if (si >= seq.length) return;
        var dayGroups = seq.slice(si, si + teams.length); si += dayGroups.length;
        var perm = assignTeams(dayGroups, teams, lastPos);
        dayGroups.forEach(function (g, i) { pushRoute(d, perm[i], g.pts, pi, g.block); });
        dayGroups.forEach(function (g) { take(g.pts.map(function (p) { return p.id; })); });
      });
    });
    routes.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.team - b.team; });
    var assign = {};
    routes.forEach(function (r) { r.stops.forEach(function (id, i) { assign[id] = { rid: r.rid, date: r.date, team: r.team, seq: i + 1 }; }); });
    var unscheduled = pool.map(function (p) { return p.id; });
    var dates = routes.map(function (r) { return r.date; });
    var uniq = dates.filter(function (d, i) { return dates.indexOf(d) === i; });
    var lastDate = uniq.length ? uniq[uniq.length - 1] : null;
    var spare = lastDate ? days.filter(function (d) { return d > lastDate; }).length : 0;
    return {
      routes: routes, assign: assign, unscheduled: unscheduled, notes: notes,
      summary: {
        firstDate: uniq[0] || null, lastDate: lastDate, fieldDays: uniq.length, spareDays: spare,
        calendarDays: days.length, totalKm: Math.round(routes.reduce(function (a, r) { return a + r.km; }, 0)),
        scheduled: Object.keys(assign).length
      }
    };
  }

  /* jarak ulang semua rute untuk homebase lain (kelompok tetap) */
  function evalHome(points, routes, home, cfg) {
    var byId = {}; points.forEach(function (p) { byId[p.id] = p; });
    var tot = 0, mx = 0;
    routes.forEach(function (r) {
      var pts = r.stops.map(function (id) { return byId[id]; }).filter(Boolean);
      var l = bestTour(home, pts).len * (cfg.circuity || 1.4);
      tot += l; if (l > mx) mx = l;
    });
    return { total: tot, avg: routes.length ? tot / routes.length : 0, max: mx };
  }

  function geomMedian(points) {
    var y = centroid(points);
    for (var it = 0; it < 300; it++) {
      var wx = 0, wy = 0, ws = 0;
      points.forEach(function (p) { var d = Math.max(km(p, y), 1e-6); wx += p.lat / d; wy += p.lng / d; ws += 1 / d; });
      var ny = { lat: wx / ws, lng: wy / ws };
      if (km(ny, y) < 1e-5) { y = ny; break; }
      y = ny;
    }
    return y;
  }

  return { plan: plan, orderStops: orderStops, timeRoute: timeRoute, calendar: calendar, km: km, evalHome: evalHome, geomMedian: geomMedian, isGGDay: isGGDay, dowOf: dowOf, toT: toT, toS: toS };
});

a City</b>: Rp3,0–3,4 jt/bulan (<a href=\"https://jendela360.com/sewa-apartemen-kalibata-city-apartment/bulanan\" target=\"_blank\" rel=\"noopener\">Jendela360</a>; <a href=\"https://www.pinhome.id/disewa/apartemen-sekunder/unit/disewakan-apartemen-kalibata-city-tower-l-unfurnished-2br-ac-wheater-di-jl-raya-kalibata\" target=\"_blank\" rel=\"noopener\">Pinhome</a>: Tower L unfurnished Rp3,4 jt kontrak 12 bulan, Rp3,6 jt untuk 3 bulan, parkir mobil bayar terpisah). Untuk 2 orang = 2 kamar, ±Rp1,7–1,8 jt per orang.</li><li><b>Kos Kramat Jati / Kalibata</b> (Rukita): Rp1,2–1,9 jt, umumnya kamar single kasur 90–120 cm; sebagian boleh 2 orang dengan biaya tambahan; parkir mobil tidak selalu ada (<a href=\"https://www.rukita.co/en/place/dato-residence-ii-kramat-jati\" target=\"_blank\" rel=\"noopener\">Dato Residence II</a>, <a href=\"https://www.rukita.co/en/place/ruoptions-andhika-kalibata\" target=\"_blank\" rel=\"noopener\">Andhika Kalibata</a>).</li><li><b>Kamar twin coliving</b>: Cove Art Living, Tebet Timur, tipe Premium Plus Twin Rp4,55 jt/bulan (<a href=\"https://cove.id/en/listings/282-cove-80-premium-room-with-twin-bed-and-external-window-cove-art-living\" target=\"_blank\" rel=\"noopener\">Cove</a>), di atas budget.</li></ul><p>Yang perlu ditanyakan sebelum bayar DP: benar 2 kasur single; parkir mobil (berapa unit, biaya); boleh sewa 2 bulan (2 Nov–31 Des) tanpa penalti; listrik/air/IPL termasuk atau tidak; jalan keluar tidak melewati ruas ganjil-genap.</p><p>Cara mencari: Mamikos atau Rukita dengan filter \"bisa berdua\" dan \"parkir mobil\"; Travelio/Jendela360 untuk apartemen bulanan. Kata kunci area: Kalibata, Rawajati, Duren Tiga, Cililitan, Kramat Jati.</p>","ggNote":"<p>Berlaku Senin–Jumat pukul 06.00–10.00 dan 16.00–21.00, tidak berlaku Sabtu, Minggu, dan libur nasional. Ada 26 ruas: Jakarta Pusat 13, Jakarta Selatan 6, Jakarta Barat 3, Jakarta Timur 4. Jakarta Utara, Kota Bekasi, Depok, dan Kota Tangerang tidak punya ruas GG. Sumber: <a href=\"https://auto2000.co.id/berita-dan-tips/wilayah-ganjil-genap-jakarta\" target=\"_blank\" rel=\"noopener\">Auto2000, 16 Agu 2026</a> (merujuk Pergub DKI 88/2019). Cek ulang ke Polda Metro Jaya/Dishub DKI sebelum hari pertama.</p><p>16 SPBU di daftar ini beralamat di ruas GG (tanda \"Ruas GG\"). Jadwal otomatis menaruhnya setelah pukul 10.00 pada hari kerja; bila tim tiba lebih awal, kartu rute menampilkan waktu tunggu.</p><p>Kalau 4 mobil campuran plat ganjil dan genap, tukar mobil antartim pada hari yang rutenya masuk Jakarta Pusat atau Selatan. Kartu harian menunjukkan tanggal ganjil/genap.</p>"};

  var PLAN = null, DRAFT = null;

  function statusOf(id) {

    if (CAP.mode === 'db') { if (CAP.canStatus === false && l) return l; return s || l; }
    return l;
  }

    if (a.date === TODAY) return 'today';

  }
  function weekOf(date) {

    var t0 = E.toT('2026-11-02'), t = E.toT(date);

  }

  /* ---------------- rencana ---------------- */
  function indexPlan(cfg, routes, source) {
    var assign = {}, byDate = {}, dates = [];
    routes.forEach(function (r) {
      r.stops.forEach(function (id, i) { assign[id] = { rid: r.rid, date: r.date, team: r.team, seq: i + 1 }; });
      if (!byDate[r.date]) { byDate[r.date] = []; dates.push(r.date); }
      byDate[r.date].push(r);
    });
    dates.sort();
    var cal = E.calendar(cfg);
    var last = dates[dates.length - 1] || null;
    var spare = last ? cal.filter(function (d) { return d > last; }).length : 0;
    var unsched = PTS.filter(function (p) { return !assign[p.id]; }).map(function (p) { return p.id; });
    var totalKm = routes.reduce(function (a, r) { return a + r.km; }, 0);
    return { cfg: cfg, routes: routes, assign: assign, byDate: byDate, dates: dates, source: source, last: last, spare: spare, cal: cal, unsched: unsched, totalKm: totalKm, byRid: routes.reduce(function (m, r) { m[r.rid] = r; return m; }, {}) };
  }
  function computePlan(cfg) {

    if (c.replanFrom && c.replanFrom > c.start) return indexPlan(c, replanRest(c, c.replanFrom, PLAN.routes), 'sim');
    return indexPlan(c, E.plan(PTS, c).routes, 'sim');
  }
  /* Susun ulang sisa jadwal mulai `from`:

     - sejak `from`: hari yang diatur manual (ditempel/diedit) atau sudah ada centangnya tetap;

  function replanRest(c, from, routes) {

    return keep.concat(E.plan(PTS, c2).routes).sort(cmpRoute);

        ids.forEach(function (n, k) { setTimeout(function () { setDone(n, true, dt); }, k * 60); });
        setTimeout(function () { refreshLight(); }, ids.length * 60 + 50);
        toast(ids.length + ' SPBU ditandai selesai.'); $('#impTxt').value = ''; return;
      case 'hSet':
        var m2 = ($('#hLL').value || '').match(/-?\d+(?:\.\d+)?/g);
        if (!m2 || m2.length < 2) { toast('Format koordinat: -6.2569, 106.8527'); return; }
        var la = +m2[0], ln = +m2[1]; if (la > 0 && ln < 0) { var sw = la; la = ln; ln = sw; }
        if (la < -6.7 || la > -5.9 || ln < 106.3 || ln > 107.3) { toast('Koordinat di luar Jabodetabek.'); return; }
        DRAFT = clone(PLAN.cfg); DRAFT.home = { name: $('#hName').value || 'Homebase', lat: la, lng: ln }; runPlan(DRAFT, 'homebase diperbarui.'); return;
      case 'hPick': UI.pickHome = true; var mh = $('#maphint'); mh.textContent = 'Klik titik penginapan di peta'; mh.hidden = false; return;
    }
  });
  /* seret-lepas (desktop): pegang nomor urut, lepas di posisi lain / kartu tim lain */
  var DRAG = null;
  function clearDrop() { $('#tabbody').querySelectorAll('.drop-before,.drop-after,.dropok,.dragging').forEach(function (x) { x.classList.remove('drop-before', 'drop-after', 'dropok', 'dragging'); }); }
  function dropSpot(ev) {
    var card = ev.target.closest && ev.target.closest('.card.editing[data-rid]'); if (!card) return null;
    var li = ev.target.closest('li.stop'), pos = null, before = true;
    if (li && card.contains(li)) {
      var rc = li.getBoundingClientRect(); before = ev.clientY < rc.top + rc.height / 2;
      pos = Array.prototype.indexOf.call(card.querySelectorAll('li.stop'), li) + (before ? 0 : 1);
    } else li = null;
    return { card: card, li: li, before: before, pos: pos, rid: card.getAttribute('data-rid') };
  }
  document.addEventListener('dragstart', function (ev) {
    var g = ev.target.closest && ev.target.closest('.sq.grip'); if (!g) return;
    var li = g.closest('li.stop'), card = g.closest('.card');
    DRAG = { id: +li.getAttribute('data-id'), rid: card.getAttribute('data-rid') };
    try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', code(DRAG.id)); ev.dataTransfer.setDragImage(li, 16, 16); } catch (e) { }
    li.classList.add('dragging');
  });
  document.addEventListener('dragover', function (ev) {
    if (!DRAG) return; var s = dropSpot(ev); if (!s) return;
    ev.preventDefault(); try { ev.dataTransfer.dropEffect = 'move'; } catch (e) { }
    $('#tabbody').querySelectorAll('.drop-before,.drop-after,.dropok').forEach(function (x) { x.classList.remove('drop-before', 'drop-after', 'dropok'); });
    s.card.classList.add('dropok'); if (s.li) s.li.classList.add(s.before ? 'drop-before' : 'drop-after');
  });
  document.addEventListener('drop', function (ev) {
    if (!DRAG) return; var s = dropSpot(ev); if (!s) return;
    ev.preventDefault();
    var d = DRAG; DRAG = null; clearDrop();
    var r = PLAN.byRid[s.rid], src = PLAN.byRid[d.rid]; if (!r || !src) return;
    var pos = s.pos;
    if (r === src) {
      if (pos == null) return;
      var oi = r.stops.indexOf(d.id); if (oi < pos) pos--; if (pos === oi) return;
      var st = r.stops.filter(function (x) { return x !== d.id; }); st.splice(pos, 0, d.id);
      commit(replaceRoute(r, buildRoute(r, r.date, r.team, st, true)), code(d.id) + ' jadi urutan ' + (pos + 1) + ' di ' + routeLabel(r) + '.');
      return;
    }
    var res = opMoveStops([d.id], r.date, r.team, pos);
    commit(res.routes, code(d.id) + ' dipindah dari ' + routeLabel(src) + ' ke ' + routeLabel(r) + '.');
  });
  document.addEventListener('dragend', function () { DRAG = null; clearDrop(); });

  var FITPAD = { paddingTopLeft: [40, 70], paddingBottomRight: [40, 110] };
  function fitFiltered() {
    if (!anyFilter()) return;
    var fl = filtered(); if (!fl.length) return;
    map.fitBounds(L.latLngBounds(fl.map(function (p) { return [p.lat, p.lng]; })), { paddingTopLeft: FITPAD.paddingTopLeft, paddingBottomRight: FITPAD.paddingBottomRight, maxZoom: 14 });
  }
  function fitDay() {
    if (UI.route !== 'day') return;
    var rs = (PLAN.byDate[UI.day] || []).filter(function (r) { return (!UI.myTeam || r.team === UI.myTeam) && (!F.team.size || F.team.has(String(r.team))); });
    var ll = [[PLAN.cfg.home.lat, PLAN.cfg.home.lng]];
    rs.forEach(function (r) { r.stops.forEach(function (id) { ll.push([BY[id].lat, BY[id].lng]); }); });
    if (ll.length > 1) map.fitBounds(L.latLngBounds(ll), { paddingTopLeft: FITPAD.paddingTopLeft, paddingBottomRight: FITPAD.paddingBottomRight, maxZoom: 14 });
  }
  var themeObs = new MutationObserver(function () { pinKey = {}; refresh(); });
  themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { pinKey = {}; refresh(); }); } catch (e) { }

  /* ---------------- kapabilitas (db bersama, user, unduhan) ---------------- */
  function initCaps() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    window.claude.use('downloads').then(function (dl) { CAP.dl = dl; if (UI.tab === 'atur') renderTab(); }).catch(function () { });
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db) return;
      CAP.db = db; CAP.mode = 'db';
      var tmo = setTimeout(function () { toast('Data bersama belum terjangkau; menampilkan data perangkat ini.'); }, 10000);
      if (user) {
        user.id().then(function (id) { CAP.myId = id; });
        user.canEdit().then(function (v) { CAP.canPlan = !!v; renderBanner(); if (UI.tab === 'jadwal') renderTab(); });
        user.can('data.write').then(function (v) { if (v === false) CAP.canStatus = false; renderKPIs(); });
      }
      db.collection('status').onSnapshot(function (snap) {
        if (!snap.metadata.fromCache) clearTimeout(tmo);
        var m = {}; snap.docs.forEach(function (d) { var v = d.data(); if (v) m[d.id] = v; });
        DBST = m;
        // pindahkan centang lokal lama ke data bersama sekali (bila boleh menulis)
        if (CAP.canStatus !== false && !snap.metadata.fromCache && !LS.get('spbu-migrated', false)) {
          var keys = Object.keys(ST).filter(function (k) { return ST[k] && ST[k].done && !(m[k] && m[k].done); });
          keys.forEach(function (k, i) { setTimeout(function () { setDone(+k, true, ST[k].at); }, i * 80); });
          LS.set('spbu-migrated', true);
        }
        refreshLight();
      }, function (e) { clearTimeout(tmo); CAP.mode = 'local'; renderKPIs(); });
      db.doc('plan/current').onSnapshot(function (snap) {
        if (!snap.exists) return;
        var v = snap.data(); savedPlan = v;
        if (!(v && v.routes && v.cfg)) return;
        var newer = !!(v.savedAt && (!UI.simAt || v.savedAt > UI.simAt));
        if (UI.simulating && UI.simRestored && newer) {
          // simulasi lama di perangkat ini sudah didahului jadwal tersimpan yang lebih baru
          UI.simulating = false; dropLocalSim(); resetEdits();
          activatePlan(indexPlan(v.cfg, v.routes, 'db')); refresh();
          toast('Jadwal terbaru yang tersimpan (' + fmtTs(v.savedAt) + ') dimuat — simulasi lama di perangkat ini dibuang.');
          return;
        }
        if (!UI.simulating) { resetEdits(); activatePlan(indexPlan(v.cfg, v.routes, 'db')); refresh(); return; }
        if (newer) { UI.newer = v.savedAt; renderBanner(); }
      }, function () { });
    }).catch(function () { });
  }

  /* ---------------- start ---------------- */
  (function start() {
    var localCfg = LS.get('spbu-cfg-v1', null), localRoutes = LS.get('spbu-routes-v1', null);
    if (localRoutes && localRoutes.routes && localRoutes.cfg) {
      // simulasi (edit manual / hitung ulang) yang belum disimpan dari kunjungan sebelumnya
      activatePlan(indexPlan(localRoutes.cfg, localRoutes.routes, 'sim'));
      UI.simulating = true; UI.simNote = localRoutes.note || 'jadwal diubah manual.'; UI.editCount = localRoutes.count || 0;
      UI.simAt = localRoutes.at || ''; UI.simRestored = true;
      localCfg = null;
    } else activatePlan(indexPlan(D.plan.cfg, D.plan.routes, 'bawaan'));
    initMap();
    refresh();
    if (localCfg) {
      // pengaturan simulasi lokal dari versi lama halaman; kalah oleh jadwal yang sudah disimpan bersama
      setTimeout(function () {
        if (savedPlan && savedPlan.routes) { LS.set('spbu-cfg-v1', null); return; }
        runPlan(localCfg, 'memakai pengaturan yang tersimpan di perangkat ini.', true);
      }, 60);
    }
    if (PLAN.dates.length && TODAY >= PLAN.dates[0] && TODAY <= PLAN.dates[PLAN.dates.length - 1]) setTimeout(fitDay, 50);
    initCaps();
  })();
})();

</script>
